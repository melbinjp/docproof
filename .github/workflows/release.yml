name: Release

# **A tag ships the Action. It does not ship the package until PyPI is armed** — see
# `RELEASING.md`. These are two distribution channels and this file used to treat them as
# one, so a tag built, checked, and then failed at the upload step.
#
# Failing there was the right instinct and the wrong mechanism. The instinct: a tag must
# never look successful when nothing was published. The mechanism was to fail the whole
# release, which also blocked the Action, which needs no PyPI at all. Now the GitHub
# release is always created, and when the publisher is unarmed a job named
# `PyPI was NOT published` runs and says so. Loud, and not fatal to the half that works.
#
# There is deliberately **no API token anywhere**, not in a secret and not in a file.
# Publishing uses PyPI trusted publishing: PyPI is told to trust this repository, this
# workflow filename and this environment, and GitHub mints a short-lived OIDC token for
# the one job that needs it. A leaked repository secret cannot exist if there is no secret.
#
# The trigger is a tag, not a push to main, because a release cannot be taken back. Merging
# is reversible; `pip install docproof==0.1.0` resolving forever is not. The tag is the
# deliberate act, and `check-release` exists to make sure it was deliberate about the right
# commit — every failure it catches produces an artifact that looks perfectly fine.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  check-release:
    name: Tag, version and branch agree
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # **THIS STEP CRASHED FOR TWO RELEASES AND THE WORKAROUND HID IT.** It read
      # `pyproject.toml`'s `project.version`, and #9 made the version DYNAMIC to stop the
      # package and the manifest disagreeing - so that key stopped existing and this raised
      # KeyError. Every job after it was skipped, including the GitHub release itself.
      #
      # v0.1.0 to v0.1.2 were published by github-actions[bot]. v0.1.3 and v0.1.4 were
      # published by hand, because the pipeline was dead and creating the release manually
      # worked. It kept working, so nothing ever came back to the pipeline. A broken
      # automation that somebody routes around stays broken and stops being visible.
      #
      # It reads the path OUT of pyproject rather than hardcoding it, so the gate and the
      # build cannot drift onto different files - which is the same defect #9 fixed, and
      # hardcoding the path here would have quietly reintroduced it.
      - name: The tag names the version the package actually carries
        run: |
          python - <<'PY'
          import os, sys, tomllib, pathlib
          tag = os.environ["GITHUB_REF_NAME"]
          config = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          try:
              source = pathlib.Path(config["tool"]["hatch"]["version"]["path"])
          except KeyError:
              sys.exit("::error::pyproject.toml declares no [tool.hatch.version] path, so "
                       "this gate cannot know where the version lives. Fix the gate rather "
                       "than removing it.")
          # No backslash in this parse, deliberately, for the reason the README-pin step
          # below gives: an escape written the usual way has reached disk as a control byte
          # on this project before, and a check that cannot match reports nothing.
          line = next((ln for ln in source.read_text(encoding="utf-8").splitlines()
                       if ln.startswith("__version__")), "")
          parts = line.split(chr(34))
          version = parts[1] if len(parts) > 2 else ""
          if not version:
              sys.exit(f"::error::{source} has no __version__ line this gate can read.")
          if tag != f"v{version}":
              sys.exit(f"::error::tag {tag} but {source} says {version}. "
                       f"A release under the wrong number cannot be corrected, only superseded.")
          print(f"{tag} matches {source} {version}")
          PY

      - name: Every README pin of the Action names this tag
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          tag = os.environ["GITHUB_REF_NAME"]
          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          # No backslash anywhere in this pattern, deliberately. A word boundary written the
          # usual way has arrived on disk as a literal backspace byte more than once on this
          # machine, and a regex that cannot match breaks nothing and reports nothing.
          pins = set(re.findall("melbinjp/docproof@(v[0-9]+[.][0-9]+[.][0-9]+)", readme))
          if not pins:
              sys.exit("::error::README pins the Action nowhere. The snippet a reader copies "
                       "is the whole adoption path; if it is gone, say so deliberately rather "
                       "than by deletion.")
          wrong = sorted(pin for pin in pins if pin != tag)
          if wrong:
              sys.exit(f"::error::README pins {', '.join(wrong)} but this release is {tag}. "
                       f"A tool whose argument is that documentation drifts does not get to "
                       f"ship a README pinning a version that is not this one.")
          print(f"README pins {tag} in {len(pins)} distinct form(s), all correct")
          PY

      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main." >&2
            echo "Publishing it would ship code that no merged branch contains." >&2
            exit 1
          fi
          echo "Tagged commit is on main."

  # The full suite, on every OS and Python the package claims to support, plus the job that
  # builds the artifact and runs it from a clean install. A release is the one moment where
  # "CI was green last week" is not good enough.
  ci:
    name: CI
    needs: check-release
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and check artifacts
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      # twine's check is about the description rendering on PyPI. It is the one defect
      # that is invisible locally and permanent once uploaded.
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  # **The Action and the package are two distribution channels, and this workflow wired
  # them as one.** RELEASING.md says so itself, and then orders the steps as though they
  # were a single chain: arm PyPI, then tag, then list on Marketplace. The middle step is
  # mine and the outer two are his, so a tag could not happen until he had done something
  # that the Action does not need at all.
  #
  # Marketplace publishes from a GitHub Release. A GitHub Release needs a tag and nothing
  # else. PyPI is irrelevant to it. Splitting them removes one of his two blocking steps
  # outright, and the one that remains is the tick that genuinely requires his 2FA.
  github-release:
    name: GitHub release, which is what the Action installs from
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - name: Create the release the Marketplace listing is made from
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes

  # **Skipping loudly, because the original design failed here on purpose and it was
  # right to.** The old comment said failing at the last step "is the correct behaviour
  # for a repository whose release path has never been armed", and the danger in relaxing
  # it is making a tag look successful when nothing was published. So this does not go
  # quiet: when PyPI is unarmed a job runs whose name says so, and prints what did not
  # happen. A grey skipped box is not a report.
  pypi-not-armed:
    name: PyPI was NOT published, the publisher is not armed
    needs: build
    if: vars.PYPI_ARMED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Say exactly what did not happen
        run: |
          echo "::notice title=Nothing was published to PyPI::This tag produced a GitHub release, which is all the Action needs. It did NOT publish to PyPI, because the trusted publisher on pypi.org has never been set up. See RELEASING.md. Set the repository variable PYPI_ARMED to true once it exists."
          echo "GitHub release: created. PyPI: not attempted."

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: vars.PYPI_ARMED == 'true'
    runs-on: ubuntu-latest
    # A GitHub environment, so a required reviewer can be added to it later and this
    # becomes "ask me first" without touching the workflow.
    environment:
      name: pypi
      url: https://pypi.org/p/docproof
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
